# MADTwin DVC pipeline.
stages:

  baseline_metrics:
    desc: Parse a SUMO run bundle into BaselineMetrics JSON.
    cmd: python -m scripts.analyze_baseline
    deps:
      - src/madrid_twin/eval/baseline.py
      - scripts/analyze_baseline.py
      - data/outputs/baseline/summary.xml
      - data/outputs/baseline/tripinfo.xml
    outs:
      - data/outputs/baseline/baseline_metrics.json:
          cache: false

  probe_traffic_intensity:
    desc: Smoke probe of the Madrid Ayuntamiento real-time intensity feed.
    cmd: python -m scripts.probe_open_data
    deps:
      - src/madrid_twin/data/open_data.py
      - src/madrid_twin/data/probe.py
      - scripts/probe_open_data.py
    always_changed: true
    outs:
      - data/raw/traffic_intensity:
          cache: false
          persist: true

  fit_baselines:
    desc: Phase 2 — fit classical forecaster baselines + conformal coverage.
    cmd: python -m scripts.fit_baselines
    deps:
      - src/madrid_twin/predict/baselines.py
      - src/madrid_twin/predict/features.py
      - src/madrid_twin/predict/conformal.py
      - scripts/fit_baselines.py
    outs:
      - data/outputs/predict/baselines_report.json:
          cache: false

  smoke_control:
    desc: Phase 3 — roll out FixedTime + MaxPressure on the mock queue env.
    cmd: python -m scripts.smoke_control
    deps:
      - src/madrid_twin/control/baselines.py
      - src/madrid_twin/control/rewards.py
      - src/madrid_twin/control/env.py
      - scripts/smoke_control.py
    outs:
      - data/outputs/control/smoke_report.json:
          cache: false

  calibrate_od:
    desc: >-
      Phase 4 — W-SPSA OD calibration demo on synthetic data. Verifies
      the algorithm converges on a known-optimum quadratic objective
      independent of SUMO.
    cmd: python -m scripts.calibrate_od
    deps:
      - src/madrid_twin/sim/calibrate.py
      - scripts/calibrate_od.py
    outs:
      - data/outputs/sim/calibrate_od_report.json:
          cache: false
