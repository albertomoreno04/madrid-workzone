# MADTwin DVC pipeline.
#
# Stages are run via ``dvc repro <stage>``. Each stage declares its
# dependencies and outputs so the pipeline only re-runs when something
# upstream changes.
stages:

  baseline_metrics:
    desc: >-
      Parse a SUMO run bundle into BaselineMetrics JSON. Inputs are the
      summary.xml / tripinfo.xml / statistics.xml emitted by a SUMO run.
    cmd: python -m scripts.analyze_baseline
    deps:
      - src/madrid_twin/eval/baseline.py
      - scripts/analyze_baseline.py
      - data/outputs/baseline/summary.xml
      - data/outputs/baseline/tripinfo.xml
    outs:
      - data/outputs/baseline/baseline_metrics.json:
          cache: false

  probe_traffic_intensity:
    desc: >-
      One-shot probe of the Madrid Ayuntamiento real-time traffic
      intensity feed. Writes a timestamped XML snapshot under
      data/raw/traffic_intensity/ for inspection.
    cmd: python -m scripts.probe_open_data
    deps:
      - src/madrid_twin/data/open_data.py
      - src/madrid_twin/data/probe.py
      - scripts/probe_open_data.py
    always_changed: true
    outs:
      - data/raw/traffic_intensity:
          cache: false
          persist: true

  fit_baselines:
    desc: >-
      Fit the classical forecaster baselines (HA / NaiveLastValue / AR1)
      on a held-out training split and report point-forecast metrics on
      a validation split. Phase 2 predictive-layer entry point.
    cmd: python -m scripts.fit_baselines
    deps:
      - src/madrid_twin/predict/baselines.py
      - src/madrid_twin/predict/features.py
      - src/madrid_twin/predict/conformal.py
      - scripts/fit_baselines.py
    outs:
      - data/outputs/predict/baselines_report.json:
          cache: false
