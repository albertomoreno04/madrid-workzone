[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-workzone-digital-twin"
version = "0.1.0"
description = "MADTwin — heterogeneous MARL digital twin for Madrid workzone traffic management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alberto Moreno", email = "amoreno@grupoteva.com" },
]
keywords = [
    "digital-twin",
    "traffic",
    "sumo",
    "multi-agent-reinforcement-learning",
    "workzone",
    "intelligent-transportation-systems",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "tqdm>=4.66,<5",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
sim = [
    "traci>=1.20",
    "sumolib>=1.20",
    "libsumo>=1.20; platform_system != 'Windows'",
]

data = [
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
]

predict = [
    "torch>=2.2,<3",
    "torch-geometric>=2.5,<3",
    "torch-geometric-temporal>=0.54,<1",
    "mapie>=0.8,<1",
    "scikit-learn>=1.5,<2",
]

control = [
    "gymnasium>=0.29,<2",
    "pettingzoo>=1.24,<2",
    "ray[rllib]>=2.30,<3",
    "torch>=2.2,<3",
]

eval = [
    "matplotlib>=3.9,<4",
    "plotly>=5.22,<7",
    "salib>=1.5,<2",
]

dev = [
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "hypothesis>=6.100,<7",
    "pre-commit>=3.7,<5",
    "mlflow>=2.14,<3",
    "dvc>=3.50,<4",
    "ipykernel>=6.29,<7",
]

all = [
    "madrid-workzone-digital-twin[sim,data,predict,control,eval,dev]",
]

[project.urls]
Homepage = "https://github.com/albertomoreno04/madrid-workzone"
Issues = "https://github.com/albertomoreno04/madrid-workzone/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madrid_twin = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "PLC0415"]
"src/madrid_twin/eval/tracking.py" = ["PLC0415"]
"src/madrid_twin/predict/stgnn.py" = ["PLC0415"]
"src/madrid_twin/predict/stgnn_pignn.py" = ["PLC0415"]
"src/madrid_twin/control/spaces.py" = ["PLC0415"]
"src/madrid_twin/control/env.py" = ["PLC0415"]
"src/madrid_twin/control/train_mappo.py" = ["PLC0415"]
"src/madrid_twin/sim/runner.py" = ["PLC0415"]
"src/madrid_twin/sim/snap.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "sumo: integration tests that require a SUMO binary on PATH",
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["src/madrid_twin"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
