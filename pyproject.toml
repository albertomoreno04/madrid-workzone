[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-workzone-digital-twin"
version = "0.1.0"
description = "MADTwin — heterogeneous MARL digital twin for Madrid workzone traffic management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alberto Moreno", email = "amoreno@grupoteva.com" },
]
keywords = [
    "digital-twin",
    "traffic",
    "sumo",
    "multi-agent-reinforcement-learning",
    "workzone",
    "intelligent-transportation-systems",
]

# --- core dependencies -----------------------------------------------------
# Kept deliberately small: only what every layer needs. Heavyweight stacks
# (torch, RLlib, geopandas, etc.) go behind optional-dependencies groups so
# CI smoke tests stay fast and developers only pull what they actively use.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# SUMO Python API + network/demand utilities. ``libsumo`` is the fast in-process
# binding; ``traci`` is the reference network-protocol binding kept as fallback.
sim = [
    "traci>=1.20",
    "sumolib>=1.20",
    "libsumo>=1.20; platform_system != 'Windows'",
]

# Data ingestion and zone analysis.
data = [
    "requests>=2.32,<3",
    "httpx>=0.27,<1",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
]

# Predictive layer. Torch versions are pinned conservatively; torch-geometric
# is pulled lazily by the relevant submodule to avoid surprising CI.
predict = [
    "torch>=2.2,<3",
    "torch-geometric>=2.5,<3",
    "torch-geometric-temporal>=0.54,<1",
    "mapie>=0.8,<1",
    "scikit-learn>=1.5,<2",
]

# Control layer — MARL.
control = [
    "gymnasium>=0.29,<2",
    "pettingzoo>=1.24,<2",
    "ray[rllib]>=2.30,<3",
    "torch>=2.2,<3",
]

# Evaluation extras: plotting + sensitivity + emissions/equity helpers.
eval = [
    "matplotlib>=3.9,<4",
    "plotly>=5.22,<7",
    "salib>=1.5,<2",
]

# MLflow + DVC + dev tools.
dev = [
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "hypothesis>=6.100,<7",
    "pre-commit>=3.7,<5",
    "mlflow>=2.14,<3",
    "dvc>=3.50,<4",
    "ipykernel>=6.29,<7",
]

# Convenience: install everything.
all = [
    "madrid-workzone-digital-twin[sim,data,predict,control,eval,dev]",
]

[project.urls]
Homepage = "https://github.com/your-org/madrid-workzone"
Documentation = "https://github.com/your-org/madrid-workzone/blob/main/PROJECT_PLAN.md"
Issues = "https://github.com/your-org/madrid-workzone/issues"

# --- setuptools package discovery -----------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madrid_twin = ["py.typed"]

# --- ruff ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "PL",  # pylint subset
]
ignore = [
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic numbers
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally exercise import-time behaviour and use local imports.
"tests/*" = ["PLR2004", "S101", "PLC0415"]
# tracking.py keeps mlflow as a lazy import so the package is usable without
# the dev extras installed.
"src/madrid_twin/eval/tracking.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"

# --- mypy ------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
strict = false

# --- pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "sumo: integration tests that require a SUMO binary on PATH",
    "slow: tests that take more than a few seconds",
]

# --- coverage -------------------------------------------------------------

[tool.coverage.run]
source = ["src/madrid_twin"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
